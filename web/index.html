<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界线存档</title>
    <meta
      name="description"
      content="记录那些值得被收藏的世界线：BGM、动漫、电影、剧集、漫画、壁纸、随笔与代码笔记。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 避免主题闪烁：应用挂载前先应用持久化的主题
      ;(function () {
        var t = localStorage.getItem('worldline-theme') || 'dark'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
